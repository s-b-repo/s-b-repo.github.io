name: Refresh currency rates

# assets/rates.js drives the indicative price conversions on the store page. Left
# alone it silently drifts, and a stale rate on a pricing page is worse than no
# conversion at all — so refresh it weekly rather than trusting anyone to remember.
on:
  schedule:
    - cron: "17 4 * * 1"      # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and regenerate assets/rates.js
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request

          CURRENCIES = ["ZAR", "EUR", "GBP", "AUD", "CAD", "CHF", "AED", "SGD", "INR", "NZD"]

          with urllib.request.urlopen("https://open.er-api.com/v6/latest/USD", timeout=30) as r:
              data = json.load(r)

          # Never overwrite a good file with a bad response.
          if data.get("result") != "success" or data.get("base_code") != "USD":
              sys.exit("upstream returned an unexpected payload; keeping existing rates")
          missing = [c for c in CURRENCIES if not isinstance(data.get("rates", {}).get(c), (int, float))]
          if missing:
              sys.exit(f"missing or non-numeric rates for {missing}; keeping existing rates")
          # A rate that has moved by more than 25% in a week is far more likely to be a
          # bad feed than a real move. Fail loudly instead of repricing the site.
          try:
              old = open("assets/rates.js", encoding="utf-8").read()
              for c in CURRENCIES:
                  import re
                  m = re.search(rf"\b{c}:\s*([\d.]+)", old)
                  if m:
                      prev, now = float(m.group(1)), float(data["rates"][c])
                      if prev and abs(now - prev) / prev > 0.25:
                          sys.exit(f"{c} moved {prev} -> {now} (>25%); refusing to auto-commit")
          except FileNotFoundError:
              pass

          lines = "\n".join(f"    {c}: {round(float(data['rates'][c]), 4)}," for c in CURRENCIES)
          open("assets/rates.js", "w", encoding="utf-8").write(f'''/* Cyber Sec — USD reference rates.
             Regenerated by .github/workflows/refresh-rates.yml; do not hand-edit.
             Source: open.er-api.com. These drive the indicative price conversions on the
             store page only — every engagement is still quoted and invoiced in USD. */
          window.CS_RATES = {{
            base: "USD",
            updated: "{data["time_last_update_utc"][5:16]}",
            rates: {{
              USD: 1,
          {lines}
            }}
          }};
          '''.replace("\n          ", "\n").lstrip())
          print("rates.js regenerated for", data["time_last_update_utc"])
          PY

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/rates.js; then
            echo "rates unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rates.js
          git commit -m "chore: refresh currency rates"
          git push
